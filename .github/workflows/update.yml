name: Monthly incremental update

# Detect new DEM GeoTIFFs on the BC objectstore, build STAC items for them,
# sync to s3://stac-dem-bc, and commit refreshed data/ caches back to main.
# Modeled on water-temp-bc's snapshot.yml: monthly cron on a GitHub-hosted
# runner, AWS auth via OIDC against role_gha_stac_dem_bc (provisioned by
# NewGraphEnvironment/rtj#184, trust scoped to main).
#
# detect step exit contract: 0 = no changes (skip rest, succeed),
# 1 = changes detected (continue), 2 = error (fail). A deletions-only month
# exits 1 with no urls_new.txt - item steps are skipped but the cache commit
# still records the deletions.
#
# State model: data/ caches persist only via the end-of-job commit, so a
# failed run discards its partial state and the next run re-detects cleanly.
# pgstac registration is NOT done here: no runner can reach the STAC host (no
# tailnet, no deploy key). It is a client-side upsert run from a machine that
# can - `scripts/catalogue_register.sh --drift` - and it is stateless, so a
# month nobody registers is picked up by the next run. See scripts/README.md.

on:
  schedule:
    # 3rd of the month, 09:23 UTC - staggered from water-temp-bc (1st) and
    # off the top of the hour. GitHub may delay scheduled runs under load.
    - cron: '23 9 3 * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: >-
          Reconcile EVERY published item against the current pairing (adds the
          dsm asset, repairs legacy hrefs). One-time catch-up; leave false for
          normal runs. Safe to re-run - already-correct items are detected and
          not re-uploaded, and completed ids are skipped via the manifest.
        type: boolean
        default: false
      rename:
        description: >-
          #34 ONE-TIME: migrate every published item to the renamed collection
          and asset key. The target names are collection_patch.COLLECTION_ID and
          stac_utils.ASSET_DEM -- named here rather than spelled out, so this
          description cannot go stale. Rewrites all ~102k item
          bodies in place; ids and hrefs are unchanged. Safe to re-run --
          already-migrated items are detected and not re-uploaded. Do NOT set
          this together with backfill: they write to the same directory, and
          the second would fetch the published body over the first's output.
        type: boolean
        default: false

permissions:
  id-token: write   # OIDC token for AWS
  contents: write   # commit refreshed data/ caches back to main

concurrency:
  group: stac-update
  cancel-in-progress: false

env:
  STAC_OUTPUT_DIR: ${{ github.workspace }}/stac_out

jobs:
  update:
    runs-on: ubuntu-latest
    # Recent growth averages ~7.6k files/month ~ 75-90 min at observed rates.
    # Oversized batches (>~35k) cannot fit any timeout - see README triage.
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::sessioninfo

      - uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python \
            "pystac[validation]>=1.12.0" "pystac-client>=0.8.0" \
            "rio-stac>=0.11.0" "rasterio>=1.4.0" rio-cogeo shapely \
            pandas requests tqdm deepdiff pytest
          .venv/bin/python -c "import rasterio, rio_stac, pystac, jsonschema; print('imports OK, rasterio', rasterio.__version__)"

      # The pairing decides whether a tile gets a dsm asset or is recorded as a
      # coverage gap, so its contract runs before the catalog is touched. Fast
      # and offline - fixtures are real listings committed under tests/.
      - name: Run pairing contract tests
        run: .venv/bin/python -m pytest tests/ -q

      # Before anything writes. The check used to live inside the migrate step,
      # which is ordered AFTER the backfill step -- so dispatching both ran the
      # entire ~102k-item backfill and only then aborted. They share
      # $STAC_OUTPUT_DIR, and whichever ran second would fetch the published
      # body over the first's output.
      #
      # A step that FAILS, not an `if:` that skips: `if: inputs.rename &&
      # !inputs.backfill` would silently do nothing and report success.
      - name: Refuse conflicting one-time dispatches
        if: inputs.backfill && inputs.rename
        run: |
          echo "::error title=Conflicting inputs::backfill and rename both set." \
               "They rewrite the same items into the same directory, so the" \
               "second would overwrite the first. Dispatch them separately."
          exit 1

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::414155577829:role/role_gha_stac_dem_bc
          aws-region: us-west-2

      - name: Detect changes
        id: detect
        shell: bash
        run: |
          set +e
          Rscript scripts/detect_changes.R
          code=$?
          set -e
          echo "detect exit code: $code"
          case "$code" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "changes=true"  >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac
          if [ -s data/urls_new.txt ]; then
            echo "new URLs: $(wc -l < data/urls_new.txt)"
            echo "new_urls=true" >> "$GITHUB_OUTPUT"
          else
            echo "no new URLs (no changes, or deletions only)"
            echo "new_urls=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check source URL access (warn-only)
        if: steps.detect.outputs.new_urls == 'true'
        continue-on-error: true
        run: .venv/bin/python scripts/urls_check_access.py --urls-file data/urls_new.txt

      # Runs on every month with changes, not only months with new URLs: a DSM
      # can arrive for a DEM already in the catalog, and the refreshed report is
      # the record of which tiles have no surface model. Exits 2 if either
      # listing is missing or empty, which fails the job rather than letting an
      # unreadable listing pass as "this bucket has no DSM".
      - name: Pair DEM tiles with their DSM siblings
        if: steps.detect.outputs.changes == 'true' || inputs.backfill
        run: .venv/bin/python scripts/dsm_pair.py

      - name: Fetch current collection from S3
        if: steps.detect.outputs.new_urls == 'true' || inputs.backfill || inputs.rename
        run: |
          mkdir -p "$STAC_OUTPUT_DIR"
          curl -fsSL https://stac-dem-bc.s3.amazonaws.com/collection.json \
            -o "$STAC_OUTPUT_DIR/collection.json"

      # The collection is fetched, not regenerated, so collection_create.py
      # never runs here and its metadata would never reach the live file.
      # Idempotent: a no-op once the published collection carries the fields.
      - name: Patch collection metadata
        if: steps.detect.outputs.new_urls == 'true' || inputs.backfill || inputs.rename
        # --clear-version: this run is about to append items, which makes any
        # version the collection carries FALSE rather than merely stale. A wrong
        # version says "you already have this one"; absent says "go and check".
        # The next release re-stamps with --version.
        run: .venv/bin/python scripts/collection_patch.py --path "$STAC_OUTPUT_DIR/collection.json" --clear-version

      - name: Create STAC items (incremental)
        if: steps.detect.outputs.new_urls == 'true'
        run: .venv/bin/python scripts/item_create.py --incremental

      # Counted BEFORE the pairing rebuild writes into the same directory.
      # Otherwise CREATED is new + rebuilt, and a real shortfall in new items
      # (20 of 100 failed) is masked by an unrelated batch of rebuilds (30),
      # suppressing the very warning this step exists to raise.
      - name: Count new items (warn on shortfall)
        id: created
        if: steps.detect.outputs.new_urls == 'true'
        run: |
          NEW=$(wc -l < data/urls_new.txt | tr -d ' ')
          CREATED=$(find "$STAC_OUTPUT_DIR" -maxdepth 1 -type f -name "*.json" ! -name "collection.json" | wc -l | tr -d ' ')
          echo "expected $NEW new items, created $CREATED"
          echo "count=$CREATED" >> "$GITHUB_OUTPUT"
          if [ "$CREATED" -lt "$NEW" ]; then
            echo "::warning title=Item shortfall::created $CREATED of $NEW new items - some source URLs failed metadata extraction or were invalid; see run-logs artifact and the triage notes in scripts/README.md"
          fi

      # A DSM can arrive for a DEM already in the catalog. Nothing else would
      # rebuild that item -- item_create.py otherwise only ever sees newly-listed
      # DEM URLs -- so the pairing diff drives an explicit rebuild pass. The file
      # is written empty when nothing changed, so the step is a cheap no-op.
      - name: Rebuild items whose DSM pairing changed
        if: steps.detect.outputs.changes == 'true'
        run: |
          if [ -s data/urls_pairing_changed.txt ]; then
            echo "rebuilding $(wc -l < data/urls_pairing_changed.txt) items"
            if [ ! -s "$STAC_OUTPUT_DIR/collection.json" ]; then
              mkdir -p "$STAC_OUTPUT_DIR"
              curl -fsSL https://stac-dem-bc.s3.amazonaws.com/collection.json \
                -o "$STAC_OUTPUT_DIR/collection.json"
              .venv/bin/python scripts/collection_patch.py --path "$STAC_OUTPUT_DIR/collection.json" --clear-version
            fi
            .venv/bin/python scripts/item_create.py --urls-file data/urls_pairing_changed.txt
          else
            echo "no pairing changes"
          fi

      # One-time reconciliation of the historical catalogue, run by dispatching
      # this workflow with backfill=true. It is NOT part of the monthly path:
      # items created from here on carry the dsm asset at creation, and a DSM
      # arriving later for an existing item is handled by the pairing-rebuild
      # step above. Runs in CI rather than from a laptop so the publish is
      # reproducible, uses the same OIDC credentials as every other run, and
      # leaves run logs as evidence.
      - name: Backfill published items (one-time, dispatch only)
        if: inputs.backfill
        run: |
          .venv/bin/python scripts/item_backfill.py \
            --out-dir "$STAC_OUTPUT_DIR" \
            --manifest data/backfill_done.txt \
            --workers 16 --verify 40

      # #34 ONE-TIME. Runs AFTER the collection patch, which is what renames
      # collection.json, and after item_create -- so any new items this month
      # were already built with the new id (item_create reads collection.id off
      # the fetched file) and the migration skips them via skip_already_staged.
      # Ordering is load-bearing, not incidental.
      #
      # Running alongside backfill is refused by the first step in the job, not
      # here: a check placed here would fire only after the backfill had already
      # spent ~102k fetches writing into the same directory.
      - name: Migrate published items to the renamed collection (dispatch only)
        if: inputs.rename
        run: |
          .venv/bin/python scripts/item_migrate.py \
            --collection "$STAC_OUTPUT_DIR/collection.json" \
            --out-dir "$STAC_OUTPUT_DIR" \
            --manifest data/migrate_done.txt \
            --errors-log data/migrate_errors.txt \
            --workers 16 --verify 40

      # Separate from the shortfall count above: this one gates validate/sync and
      # must include rebuilt items, since a pairing-only month produces item
      # JSONs and no new URLs at all.
      - name: Count items to publish
        id: publish
        if: steps.detect.outputs.changes == 'true' || inputs.backfill || inputs.rename
        run: |
          TOTAL=$(find "$STAC_OUTPUT_DIR" -maxdepth 1 -type f -name "*.json" ! -name "collection.json" | wc -l | tr -d ' ')
          echo "items staged for publish: $TOTAL"
          echo "count=$TOTAL" >> "$GITHUB_OUTPUT"

      # created == 0 (an all-invalid batch, precedent: the 90 parenthesized
      # files arrived as one such delta) must not wedge the month: skip
      # validate/sync, stay green with the shortfall warning, and let the
      # cache commit record the batch as attempted.
      # --incremental skips ids already present in the ledger. On a monthly run
      # that is exactly right (only new items need checking). On a BACKFILL run
      # every rewritten item is already in the ledger, so --incremental would
      # validate nothing and the gate would pass vacuously on ~96k unchecked
      # files. The backfill therefore runs a full validation into a scratch
      # file: a real gate, and one that cannot overwrite the ledger the way a
      # bare full run against a scratch dir would.
      - name: Validate new items (gate)
        if: steps.publish.outputs.count != '0' && steps.publish.outputs.count != ''
        run: |
          if [ "${{ inputs.backfill }}" = "true" ] || [ "${{ inputs.rename }}" = "true" ]; then
            .venv/bin/python scripts/item_validate.py \
              --items-dir "$STAC_OUTPUT_DIR" \
              --output "$RUNNER_TEMP/validation_rewrite.csv"
          else
            .venv/bin/python scripts/item_validate.py --items-dir "$STAC_OUTPUT_DIR" --incremental
          fi

      # Every item staged for publish must agree with the collection it is about
      # to be published under. Nothing downstream can check this: item ids do not
      # change during a rename, so set equality reports IN SYNC over a fully
      # mixed catalogue; item_register.sh routes by each body's own `collection`
      # field, so a stale item registers successfully; and both asset keys are
      # legal STAC.
      #
      # The standing guard, and the reason #34 cannot silently recur. item_create
      # reads the collection id from DATA (collection.id off the fetched file,
      # so it self-heals) but the asset key from CODE (so it does not). A month
      # that built items under the wrong id or the wrong asset key would publish
      # them into a mixed catalogue that nothing downstream can see.
      #
      # Placed HERE, after the pairing rebuild and gated on the publish count
      # rather than on new_urls, because both of those were holes: items rebuilt
      # for a pairing change were never audited, and a pairing-only month
      # (changes=true, new_urls=false) skipped the audit entirely while still
      # publishing. It now sees exactly what the sync is about to upload.
      - name: Audit newly created items (monthly)
        if: >-
          !inputs.backfill && !inputs.rename
          && steps.publish.outputs.count != '0' && steps.publish.outputs.count != ''
        run: |
          COLLECTION=$(.venv/bin/python -c \
            'import json,os; print(json.load(open(os.environ["STAC_OUTPUT_DIR"] + "/collection.json"))["id"])')
          # Read from stac_utils, never spelled here. A literal in this file
          # would be a second definition of the asset key, outside every guard
          # this change added to prevent exactly that.
          DEM=$(.venv/bin/python -c 'import sys; sys.path.insert(0,"scripts"); import stac_utils; print(stac_utils.ASSET_DEM)')
          OLD=$(.venv/bin/python -c 'import sys; sys.path.insert(0,"scripts"); import item_migrate; print(",".join(item_migrate.ASSET_RENAMES))')
          .venv/bin/python scripts/register_manifest.py audit-items \
            --dir "$STAC_OUTPUT_DIR" --collection-id "$COLLECTION" \
            --require-asset "$DEM" --forbid-asset "$OLD" \
            --expect "${{ steps.publish.outputs.count }}"

      # This step asserts HOMOGENEITY only. COMPLETENESS is item_migrate's own
      # reconciliation (manifest + staged == published), which exits non-zero and
      # so fails the job before this runs. One statement, one owner: expecting
      # the published total HERE would be wrong on any resumed run, where the
      # staged set is legitimately only the remainder.
      #
      # An empty directory is a failure inside audit-items, not a vacuous pass.
      - name: Audit staged items against the collection (rewrite runs)
        if: (inputs.backfill || inputs.rename) && steps.publish.outputs.count != '0'
        run: |
          COLLECTION=$(.venv/bin/python -c \
            'import json,os; print(json.load(open(os.environ["STAC_OUTPUT_DIR"] + "/collection.json"))["id"])')
          echo "auditing staged items against $COLLECTION"
          ARGS=(--dir "$STAC_OUTPUT_DIR" --collection-id "$COLLECTION")
          if [ "${{ inputs.rename }}" = "true" ]; then
            # From the modules, never spelled here -- see the monthly audit.
            DEM=$(.venv/bin/python -c 'import sys; sys.path.insert(0,"scripts"); import stac_utils; print(stac_utils.ASSET_DEM)')
            OLD=$(.venv/bin/python -c 'import sys; sys.path.insert(0,"scripts"); import item_migrate; print(",".join(item_migrate.ASSET_RENAMES))')
            ARGS+=(--require-asset "$DEM" --forbid-asset "$OLD")
          fi
          .venv/bin/python scripts/register_manifest.py audit-items "${ARGS[@]}"

      # Runs when there are new items OR only rebuilt ones: a pairing-only month
      # produces item JSONs and no new URLs, and skipping the sync would leave
      # them on the runner.
      - name: Sync catalog to S3
        id: sync
        if: steps.publish.outputs.count != '0' && steps.publish.outputs.count != ''
        run: bash scripts/s3_sync-ci.sh

      # always() so a FAILED run still persists what it completed. The first
      # backfill run finished all 98,040 items and then exited non-zero on 2
      # transient errors; because this step was skipped, the manifest recording
      # 98,038 successes was never committed and a re-run would have restarted
      # from zero. Progress state must survive the failure path.
      - name: Commit refreshed caches
        if: always() && (steps.detect.outputs.changes == 'true' || inputs.backfill || inputs.rename)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/

          # A rewrite manifest is a claim that its ids are PUBLISHED, because
          # `todo = published - manifest` on the next run. If the sync did not
          # run, they are not published -- and committing it would make every
          # future run skip work that never reached S3, permanently and
          # silently. That is the exact failure this whole change exists to
          # prevent, arriving through its own progress file.
          #
          # This does NOT undo the always() above, which exists because a run
          # completed 98,040 items and then exited non-zero on 2 transient
          # failures, and the lost manifest would have restarted it from zero.
          # A tolerated error rate still exits 0 and still reaches the sync, so
          # that progress is still preserved. Only progress that was never
          # published is dropped, and dropping it costs a re-fetch rather than a
          # permanently unmigrated catalogue.
          if [ "${{ steps.sync.outcome }}" != "success" ]; then
            echo "sync did not run (outcome: ${{ steps.sync.outcome }}) -" \
                 "discarding rewrite manifests so the work is redone, not skipped"
            for f in data/migrate_done.txt data/backfill_done.txt; do
              # Unstage always; restore only a file git actually tracks.
              # Branching explicitly rather than suppressing stderr on a
              # mutating command: `git checkout --` destroys working-tree
              # content, `-q` already silences success, so a redirect here could
              # only ever hide a real failure -- and this discard is the thing
              # standing between a failed run and a permanently skipped item.
              git reset -q -- "$f" || true          # not in HEAD on the first run
              if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
                git checkout -q -- "$f"
              else
                echo "  $f is untracked; leaving it uncommitted"
              fi
            done
          fi

          if git diff --cached --quiet; then
            echo "no cache changes to commit"
            exit 0
          fi
          git commit -m "Monthly incremental update: refresh caches ($(date -u +%Y-%m))"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs
          overwrite: true   # re-runs of failed jobs otherwise 409 on the existing artifact
          path: |
            logs/*.log
            data/urls_access_checks.csv
            data/backfill_done.txt
            data/backfill_errors.txt
            data/migrate_done.txt
            data/migrate_errors.txt
          if-no-files-found: ignore

      - name: Session info
        if: always()
        run: Rscript -e 'sessioninfo::session_info()'
